<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/icons/logo.png" />
    <title>Babu</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="loader">
        <img class="loader__pup" src="/icons/logo.png" alt="" width="221" height="192" />
        <div class="loader__paws" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="loader__text">Loading…</div>
      </div>
    </div>

    <div id="player" class="player" hidden>
      <button class="player__close" type="button" aria-label="Close player">&times;</button>
      <div class="player__title"></div>
      <div class="player__stage"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
